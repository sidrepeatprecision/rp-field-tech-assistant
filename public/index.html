<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Field Tech Assistant — mobile-first PWA shell.
    The <head> sets up the installable web-app metadata (manifest, icons,
    theme color, iOS home-screen behavior). `marked` is loaded from a CDN to
    render the bot's Markdown replies; app.js drives everything.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D3552">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RP Field Tech">
  <title>RP Field Tech Assistant</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Browser-tab icon: the Repeat Precision mark only (no wordmark). -->
  <link rel="apple-touch-icon" href="/rp-mark.png">
  <link rel="icon" type="image/png" href="/favicon-64.png">

  <!-- Repeat Precision brand fonts (see rp_theme/DESIGN_SYSTEM.md):
       Syne = titles · Nunito Sans = body · JetBrains Mono = labels · Teko = display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Nunito+Sans:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Apply the saved light/dark choice BEFORE first paint to avoid a flash.
       If nothing is saved, the CSS falls back to the device's system setting. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("rp-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js" defer></script>
</head>
<body>
  <!-- Aesthetic splash: shown on every load/reload, then fades out. Pure chrome —
       it holds no state and blocks nothing. app.js removes it after a beat. -->
  <div id="splash" class="splash" role="presentation">
    <div class="splash-inner">
      <img class="splash-logo" src="/rp-logo-white.png" alt="Repeat Precision" />
      <div class="splash-title">Field Tech Assistant</div>
      <div class="splash-spinner" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Sticky top bar: menu (opens chat history) + RP logo + app name + theme + profile. -->
  <header class="app-header">
    <button id="menu-toggle" class="icon-btn" type="button" aria-label="Open chats">☰</button>
    <div class="brand">
      <img class="logo-img" src="/rp-logo-white.png" alt="Repeat Precision" />
      <span class="app-sub">Field Tech Assistant</span>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme"></button>

      <!-- Profile: click to open a popover with the signed-in user + logout. -->
      <div class="profile-wrap">
        <button id="profile-toggle" class="icon-btn profile-btn" type="button"
                aria-label="Profile" aria-haspopup="true" aria-expanded="false">
          <span id="profile-initials" class="profile-initials">–</span>
        </button>
        <div id="profile-menu" class="profile-menu" role="menu" hidden>
          <div class="profile-head">
            <div class="profile-avatar"><img src="/rp-mark.png" alt="" /></div>
            <div class="profile-id">
              <div id="profile-name" class="profile-name">Signed in</div>
              <div id="profile-email" class="profile-email">—</div>
            </div>
          </div>
          <button id="logout-btn" class="profile-action" type="button" role="menuitem">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Left panel: this device's saved chats + a New button. On phones it slides
       in over an overlay (toggled by the header ☰); on wide screens it's docked
       open. Chats live in the browser's localStorage (see app.js). -->
  <aside id="sidebar" class="sidebar" aria-label="Chat history">
    <div class="sidebar-head">
      <span class="sidebar-title">Chats</span>
      <button id="new-chat" class="new-chat-btn" type="button">+ New</button>
    </div>
    <ul id="chat-list" class="chat-list"></ul>
  </aside>
  <div id="overlay" class="overlay" hidden></div>

  <!-- Scrollable chat transcript. app.js appends message bubbles here.
       Starts with a welcome card explaining what the bot can answer. -->
  <main id="messages" class="messages" aria-live="polite">
    <div class="welcome">
      <p>Ask about PurpleSeal™ / PurpleReign™ frac plugs, pumpdown rates, WLAK components, shear ratings, setting tools, or any ENG-TB bulletin.</p>
      <p class="muted">If the docs don't cover it, contact your supervisor or engineering.</p>
    </div>
  </main>

  <!-- Bottom composer: auto-growing textarea + send button. -->
  <form id="composer" class="composer" autocomplete="off">
    <textarea
      id="prompt"
      name="prompt"
      rows="1"
      placeholder="Ask a question…"
      enterkeyhint="send"
      autocapitalize="sentences"
      autocomplete="off"
      autocorrect="on"
      spellcheck="true"
      required></textarea>
    <button id="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </form>

  <script src="/app.js?v=2" defer></script>
</body>
</html>

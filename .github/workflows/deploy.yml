name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Create/update the Worker first, so `wrangler secret put` has a script
          # to attach to. Without this, the very first deploy on a fresh account
          # fails with "Failed to upload secrets" (secrets upload before deploy).
          # Idempotent/harmless on later runs.
          preCommands: npx wrangler deploy
          # Secret names listed here are uploaded via `wrangler secret put`.
          # Their values come from the env block below (GH Actions secrets).
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

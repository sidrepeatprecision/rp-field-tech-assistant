name = "rp-fieldtech"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Preserve dashboard-set vars and secrets across Git deploys. Without this,
# every deploy clears them because wrangler.toml doesn't declare them.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Worker secrets (managed via GitHub Actions — the deploy workflows run
# `wrangler secret put` before deploying; values come from repo Actions secrets):
#   ANTHROPIC_API_KEY      — Anthropic API key (sk-ant-api03-...)          [required]
#   MONDAY_WEBHOOK_SECRET  — shared secret guarding /api/monday-webhook     [Phase 3]
#   GH_DISPATCH_TOKEN      — GitHub PAT (contents:write) to trigger rebuilds [Phase 3]
#   GH_REPO                — "owner/repo" for the repository_dispatch call   [Phase 3]
